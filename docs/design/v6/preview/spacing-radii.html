<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="row" style="align-items:flex-end; gap:14px;">
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:12px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">sm</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">12px</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:4px;">入力欄</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:16px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">md</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">16px</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:4px;">utility rect</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:22px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">card</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">22px</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--rose-gold-deep); margin-top:4px;">DEFAULT</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:24px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">2xl</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">24px</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:4px;">glass / sheet</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:28px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">xl</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">28px</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:4px;">hero</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="width:84px; height:84px; background:var(--champagne-soft); border:1px solid var(--gold-soft); border-radius:999px; margin:0 auto;"></div>
      <div style="font:500 13px/1.4 var(--font-sans); margin-top:8px;">pill</div>
      <div style="font:400 11px/1 var(--font-display); color:var(--ink-soft); margin-top:2px;">∞</div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:4px;">btn / avatar</div>
    </div>
  </div>
  <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:14px;">
    迷ったら <b>1段大きい方</b>。角丸 < 12px は禁止。ボタンは全て pill。
  </div>
</div></body></html>
