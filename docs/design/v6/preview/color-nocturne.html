<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="swatch"><div class="chip" style="background:var(--nocturne-mist);"></div><div class="meta"><div><div class="name">nocturne-mist</div><div class="role">soft veil</div></div><div class="hex">#dccfc1</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--nocturne-dusk);"></div><div class="meta"><div><div class="name">nocturne-dusk</div><div class="role">mid depth</div></div><div class="hex">#b5a594</div></div></div>
    <div class="swatch dark-text"><div class="chip" style="background:var(--nocturne-deep);"></div><div class="meta"><div><div class="name">nocturne-deep</div><div class="role" style="color:rgba(255,255,255,0.6);">hero overlay</div></div><div class="hex">#3d2e2a</div></div></div>
  </div>
  <div style="margin-top:14px; padding:14px; border-radius:18px; background:radial-gradient(ellipse at top, var(--nocturne-dusk) 0%, var(--nocturne-deep) 100%); color:#f8ede0; border:1px solid rgba(255,255,255,0.06);">
    <div style="font:500 13px/1 var(--font-sans); letter-spacing:0.18em; color:#f8e0cc;">TONIGHT</div>
    <div style="font:500 24px/1.25 var(--font-serif); letter-spacing:0.02em; color:#fce4d4; text-shadow:0 0 24px rgba(252,228,212,0.18); margin-top:6px;">夜の奥行きを敷くため<br/>のオーバーレイ専用</div>
    <div style="font:400 12px/1.5 var(--font-sans); color:rgba(252,240,224,0.7); margin-top:6px;">ヒーロー裏、写真上の文字背景、ガラスカードの土台に使う。塗りで主役にはしない。</div>
  </div>
</div></body></html>
