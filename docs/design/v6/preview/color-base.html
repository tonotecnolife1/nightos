<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="swatch"><div class="chip" style="background:var(--pearl);"></div><div class="meta"><div><div class="name">pearl</div><div class="role">page bg</div></div><div class="hex">#faf7f2</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--pearl-light);"></div><div class="meta"><div><div class="name">pearl-light</div><div class="role">elevated card</div></div><div class="hex">#fdfcf9</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--pearl-soft);"></div><div class="meta"><div><div class="name">pearl-soft</div><div class="role">recessed</div></div><div class="hex">#f5efe6</div></div></div>
    <div class="swatch dark-text"><div class="chip" style="background:var(--ink);"></div><div class="meta"><div><div class="name">ink</div><div class="role" style="color:rgba(255,255,255,0.6);">primary text</div></div><div class="hex">#2b232a</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--ink-soft);"></div><div class="meta"><div><div class="name">ink-soft</div><div class="role">secondary text</div></div><div class="hex">#6b5a58</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--ink-mute);"></div><div class="meta"><div><div class="name">ink-mute</div><div class="role">muted / placeholder</div></div><div class="hex">#a89a96</div></div></div>
  </div>
</div></body></html>
