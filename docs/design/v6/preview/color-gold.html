<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="swatch"><div class="chip" style="background:var(--gold-soft);"></div><div class="meta"><div><div class="name">gold-soft</div><div class="role">line / hairline</div></div><div class="hex">#e0c896</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--gold);"></div><div class="meta"><div><div class="name">gold</div><div class="role">VIP line / icon</div></div><div class="hex">#b89455</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--gold-deep);"></div><div class="meta"><div><div class="name">gold-deep</div><div class="role">on-light text</div></div><div class="hex">#876c3e</div></div></div>
  </div>
  <div style="margin-top:14px; padding:14px; border-radius:18px; background:var(--pearl-light); border:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <span style="display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:999px; border:1px solid var(--gold); color:var(--gold-deep); font:400 13px/1 var(--font-display); letter-spacing:0.1em;">★ VIP</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:999px; border:1px solid var(--gold); color:var(--gold-deep); font:400 13px/1 var(--font-display); letter-spacing:0.1em;">Lounge Member</span>
    <span style="font:400 12px/1.5 var(--font-sans); color:var(--wine); margin-left:auto;">⚠ Gold は <b>線・縁取り・小アイコンだけ</b>。塗り禁止。</span>
  </div>
</div></body></html>
