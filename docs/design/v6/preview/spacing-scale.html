<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="col" style="gap:10px;">
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:4px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">xs · 4px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">アイコンと文字の隙間</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:8px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">sm · 8px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">入力欄内、ピル内</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:12px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">md · 12px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">リスト行間、カード内段</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:16px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">lg · 16px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">カード内外余白（標準）</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:24px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">xl · 24px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">セクション間</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:32px; height:24px; background:var(--rose-gold); border-radius:2px;"></div>
      <div style="font:500 13px/1 var(--font-sans); width:60px;">2xl · 32px</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">画面トップ余白</div>
    </div>
  </div>
</div></body></html>
