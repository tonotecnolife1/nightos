<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="swatch"><div class="chip" style="background:var(--wine-soft);"></div><div class="meta"><div><div class="name">wine-soft</div><div class="role">danger tag bg</div></div><div class="hex">#d4a8a8</div></div></div>
    <div class="swatch dark-text"><div class="chip" style="background:var(--wine);"></div><div class="meta" style="background:var(--wine);"><div><div class="name">wine</div><div class="role" style="color:rgba(255,255,255,0.6);">danger / VIP</div></div><div class="hex">#9a5d5d</div></div></div>
    <div class="swatch dark-text"><div class="chip" style="background:var(--wine-deep);"></div><div class="meta" style="background:var(--wine-deep);"><div><div class="name">wine-deep</div><div class="role" style="color:rgba(255,255,255,0.6);">on-light text</div></div><div class="hex">#5e3838</div></div></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:10px; align-items:center;">
    <span style="display:inline-flex; align-items:center; padding:4px 12px; border-radius:999px; background:var(--wine-soft); color:var(--wine-deep); font:500 11px/1.4 var(--font-sans); letter-spacing:0.08em;">重要アラート</span>
    <span style="display:inline-flex; align-items:center; padding:4px 12px; border-radius:999px; border:1px solid var(--wine); color:var(--wine); font:400 12px/1 var(--font-display); letter-spacing:0.1em;">VIP ONLY</span>
    <span style="font:400 11px/1.4 var(--font-sans); color:var(--ink-mute); margin-left:auto;">danger は <b>エラー文字とエラー枠だけ</b></span>
  </div>
</div></body></html>
