<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div style="border-radius:22px; padding:14px 16px; background:var(--pearl-light); border:1px solid var(--line); box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:12px;">
    <div style="width:44px; height:44px; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" color="#876c3e"><path d="M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10-1.5 1-3 1-4 0z"/></svg>
    </div>
    <div style="flex:1; min-width:0;">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="font:500 14px/1.4 var(--font-sans); color:var(--ink);">田中 太郎</div>
        <span style="font:500 10px/1 var(--font-sans); padding:2px 8px; border-radius:999px; border:1px solid var(--gold); background:var(--champagne-soft); color:var(--gold-deep);">VIP</span>
      </div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">前回: 2 週間前 · 山崎キープあと 3 杯</div>
    </div>
    <div style="font:300 26px/1 var(--font-display); color:var(--rose-gold-deep); margin-right:6px;">›</div>
  </div>

  <div style="margin-top:10px; border-radius:22px; padding:14px 16px; background:var(--pearl-light); border:1px solid var(--line); box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:12px;">
    <div style="width:44px; height:44px; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-deep);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div style="flex:1; min-width:0;">
      <div style="font:500 14px/1.4 var(--font-sans); color:var(--ink);">渡辺 美咲</div>
      <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft);">来週 火曜が誕生日 · お祝いメッセージ準備</div>
    </div>
    <div style="font:300 26px/1 var(--font-display); color:var(--rose-gold-deep); margin-right:6px;">›</div>
  </div>
  <div style="font:400 11px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:10px;">
    アイコン円は <b>塗りつぶさない</b>。gold 細ラインで縁取りだけ。
  </div>
</div></body></html>
