<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="col" style="gap:14px;">
    <!-- Card default -->
    <div style="border-radius:22px; padding:16px; background:var(--pearl-light); border:1px solid var(--line); box-shadow:var(--shadow-soft);">
      <div style="font:500 11px/1 var(--font-sans); letter-spacing:0.04em; color:var(--rose-gold-deep); margin-bottom:6px;">CARD · DEFAULT</div>
      <div style="font:500 16px/1.4 var(--font-serif);">通常のサーフェス</div>
      <div style="font:400 13px/1.6 var(--font-sans); color:var(--ink-soft); margin-top:4px;">pearl-light + line 極薄 + shadow-soft。一番よく使う土台。</div>
    </div>

    <!-- MemoCard pink dashed -->
    <div style="border-radius:18px; padding:14px 16px; background:linear-gradient(180deg, rgba(243,216,200,0.30) 0%, rgba(243,216,200,0.10) 100%); border:1.5px dashed var(--rose-gold-deep);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="font:600 13px/1 var(--font-sans);">個人メモ</div>
        <span style="font:500 11px/1 var(--font-sans); padding:3px 10px; border-radius:999px; background:var(--rose-gold-soft); color:var(--rose-gold-deep);">編集OK</span>
      </div>
      <div style="font:400 13px/1.6 var(--font-sans); color:var(--ink); margin-top:8px;">来週、田中さんに新しい焼酎を提案する。</div>
    </div>

    <!-- StoreInfo beige -->
    <div style="border-radius:18px; padding:14px 16px; background:#f5ede0; border:1px solid #d9c7a8;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="font:600 13px/1 var(--font-sans);">店舗からの共有情報</div>
        <span style="font:500 11px/1 var(--font-sans); padding:3px 10px; border-radius:999px; background:#ebdcc2; color:var(--ink-soft);">閲覧のみ</span>
      </div>
      <div style="font:400 13px/1.6 var(--font-sans); color:var(--ink); margin-top:8px;">前回来店時に「次は山崎を飲みたい」と発言。</div>
    </div>
  </div>
</div></body></html>
