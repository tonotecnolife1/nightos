<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="row" style="align-items:flex-end; gap:32px;">
    <!-- KPI-XL: 56px, weight 500 metallic OK -->
    <div>
      <div class="t-label" style="margin-bottom:6px;">kpi-xl · 56 · weight 500 metallic OK</div>
      <div style="display:flex; align-items:baseline; gap:6px;">
        <span style="font:500 56px/1 var(--font-display); background:var(--rose-gold-metallic); -webkit-background-clip:text; background-clip:text; color:transparent;">¥24.8</span>
        <span style="font:400 18px/1 var(--font-sans); color:var(--ink-soft);">万</span>
      </div>
    </div>
    <!-- KPI-MD: 32px, weight 400 solid rose-gold-deep -->
    <div>
      <div class="t-label" style="margin-bottom:6px;">kpi-md · 32 · weight 400 solid</div>
      <div style="display:flex; align-items:baseline; gap:6px;">
        <span style="font:400 32px/1 var(--font-display); color:var(--rose-gold-deep);">3.2</span>
        <span style="font:400 14px/1 var(--font-sans); color:var(--ink-mute);">×</span>
      </div>
    </div>
    <!-- KPI-SM: 16px solid -->
    <div>
      <div class="t-label" style="margin-bottom:6px;">kpi-sm · 16 · weight 500 solid</div>
      <div style="display:flex; align-items:baseline; gap:4px;">
        <span style="font:500 16px/1 var(--font-display); color:var(--ink);">1,250</span>
        <span style="font:400 12px/1 var(--font-sans); color:var(--ink-mute);">件</span>
      </div>
    </div>
  </div>

  <hr style="border:none; height:1px; background:var(--line); margin:20px 0 14px;"/>

  <div style="font:500 11px/1 var(--font-sans); letter-spacing:0.08em; color:var(--rose-gold-deep); margin-bottom:10px;">日本語ベースの省略ルール</div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px 28px;">
    <div style="font:400 12px/1.6 var(--font-sans); color:var(--ink-soft);">
      <b style="color:var(--ink);">通貨</b><br/>
      ¥8,500 · 全桁<br/>
      ¥24.8 <span style="font:500 11px var(--font-sans); color:var(--ink-mute);">万</span> · 万ベース<br/>
      ¥1,200 <span style="font:500 11px var(--font-sans); color:var(--ink-mute);">万</span> / ¥1.2 <span style="font:500 11px var(--font-sans); color:var(--ink-mute);">億</span>
    </div>
    <div style="font:400 12px/1.6 var(--font-sans); color:var(--ink-soft);">
      <b style="color:var(--ink);">件数</b><br/>
      48 件 · 全桁<br/>
      1,250 件 · 全桁<br/>
      1.5 <span style="font:500 11px var(--font-sans); color:var(--ink-mute);">万</span>件 · 1万以上だけ省略
    </div>
  </div>
  <div style="font:400 11px/1.5 var(--font-sans); color:var(--wine); margin-top:14px;">
    ⚠ K / M / B 英語省略は Luxury Lady Night の世界観に合わないので使わない。
  </div>
</div></body></html>
