<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="swatch"><div class="chip" style="background:var(--champagne-soft);"></div><div class="meta"><div><div class="name">champagne-soft</div><div class="role">KPI underlay</div></div><div class="hex">#f5e8d2</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--champagne);"></div><div class="meta"><div><div class="name">champagne</div><div class="role">card ground</div></div><div class="hex">#e6cda5</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--champagne-deep);"></div><div class="meta"><div><div class="name">champagne-deep</div><div class="role">deep tone</div></div><div class="hex">#bf9d6e</div></div></div>
  </div>
  <div style="margin-top:14px; padding:14px; border-radius:18px; background:var(--pearl-light); border:1px solid var(--line);">
    <div style="height:36px; border-radius:999px; background:var(--champagne-metallic); border:1px solid rgba(255,255,255,0.5); box-shadow:var(--shadow-soft);"></div>
    <div style="font:400 12px/1.5 var(--font-display); color:var(--ink-soft); margin-top:8px;">
      champagne-metallic — softer secondary surface · NEVER paired with rose-gold on the same fill
    </div>
  </div>
</div></body></html>
