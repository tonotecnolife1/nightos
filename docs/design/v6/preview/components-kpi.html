<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="row" style="align-items:flex-start; gap:14px;">
    <!-- KPI -->
    <div style="flex:1; border-radius:22px; padding:18px; background:linear-gradient(135deg, rgba(255,255,255,0.6), rgba(245,232,210,0.5)); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.5); box-shadow:var(--shadow-luxe);">
      <div style="font:500 11px/1 var(--font-sans); color:var(--ink-soft); letter-spacing:0.1em;">今月の同伴</div>
      <div style="display:flex; align-items:baseline; gap:6px; margin-top:10px;">
        <span class="t-kpi">14</span>
        <span style="font:400 14px/1 var(--font-sans); color:var(--ink-mute);">件</span>
      </div>
      <div style="margin-top:10px; display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px; background:rgba(122,148,119,0.15); color:var(--success); font:400 11px/1.4 var(--font-sans);">▲ 3 先月比</div>
    </div>
    <!-- Stat card (3 col mini) -->
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="border-radius:22px; padding:12px 14px; background:var(--pearl-light); border:1px solid var(--line); box-shadow:var(--shadow-soft);">
        <div style="font:400 11px/1 var(--font-sans); color:var(--ink-mute); display:flex; align-items:center; gap:6px;">
          <span style="width:6px; height:6px; border-radius:999px; background:var(--gold);"></span>今月の指名
        </div>
        <div style="display:flex; align-items:baseline; gap:4px; margin-top:6px;">
          <span style="font:300 28px/1 var(--font-display); color:var(--rose-gold-deep);">18</span>
          <span style="font:400 12px/1 var(--font-sans); color:var(--ink-mute);">本</span>
        </div>
      </div>
      <div style="border-radius:22px; padding:12px 14px; background:var(--pearl-light); border:1px solid var(--line); box-shadow:var(--shadow-soft);">
        <div style="font:400 11px/1 var(--font-sans); color:var(--ink-mute); display:flex; align-items:center; gap:6px;">
          <span style="width:6px; height:6px; border-radius:999px; background:var(--gold);"></span>再来店率
        </div>
        <div style="display:flex; align-items:baseline; gap:4px; margin-top:6px;">
          <span style="font:300 28px/1 var(--font-display); color:var(--rose-gold-deep);">72</span>
          <span style="font:400 12px/1 var(--font-sans); color:var(--ink-mute);">%</span>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
