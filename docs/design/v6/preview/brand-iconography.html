<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(6,1fr); gap:10px;">
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11c0 4-4 7-9 7-1 0-2-.1-3-.4L4 19l1.5-3.5C4.6 14.3 4 12.7 4 11c0-4 4-7 8.5-7s8.5 3 8.5 7z"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">MessageCircle</div>
    </div>
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10-1.5 1-3 1-4 0z"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">Heart</div>
    </div>
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">Star</div>
    </div>
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">Calendar</div>
    </div>
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 6c0 3 0 5-3 5s-3-2-3-5l-1-6z"/><path d="M12 14v7M8 21h8"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">Wine</div>
    </div>
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 21c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/></svg>
      </div>
      <div style="font:400 11px/1.4 var(--font-sans); color:var(--ink-soft); margin-top:6px;">Users</div>
    </div>
  </div>
  <div style="font:400 11px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:14px;">
    Lucide React (stroke 1.6) を採用。アイコン円は <b>塗りなし · gold 1px 輪郭のみ</b>。色は <code style="font:400 11px var(--font-mono); background:var(--pearl-deep); padding:1px 5px; border-radius:4px;">--gold-deep</code> or <code style="font:400 11px var(--font-mono); background:var(--pearl-deep); padding:1px 5px; border-radius:4px;">--rose-gold-deep</code>。
  </div>
</div></body></html>
