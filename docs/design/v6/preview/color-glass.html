<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div style="border-radius:22px; padding:18px; height:240px; background:radial-gradient(ellipse 70% 60% at 30% 30%, #d8b894 0%, transparent 50%),radial-gradient(ellipse 80% 50% at 70% 70%, #b5a594 0%, transparent 55%),linear-gradient(135deg, #c9ad87 0%, #8c7263 100%); display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:end; box-shadow:var(--shadow-luxe);">
    <div style="backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:16px; padding:12px; border:1px solid rgba(255,255,255,0.3); background:var(--glass-pearl); color:var(--ink); height:160px; display:flex; flex-direction:column; justify-content:space-between;">
      <div><div style="font:500 12px/1 var(--font-sans);">glass-pearl</div><div style="font:400 10px/1.2 var(--font-display); opacity:0.6;">rgba(248,241,230,.65)</div></div>
      <div><div style="font:300 32px/1 var(--font-display);">12<span style="font:400 11px/1 var(--font-sans); opacity:0.6; margin-left:4px;">件</span></div><div style="font:400 10px/1 var(--font-sans); opacity:0.7; margin-top:4px;">今日の予約</div></div>
    </div>
    <div style="backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:16px; padding:12px; border:1px solid rgba(255,255,255,0.3); background:var(--glass-champagne); color:var(--ink); height:160px; display:flex; flex-direction:column; justify-content:space-between;">
      <div><div style="font:500 12px/1 var(--font-sans);">glass-champagne</div><div style="font:400 10px/1.2 var(--font-display); opacity:0.6;">rgba(230,210,174,.55)</div></div>
      <div><div style="font:300 28px/1 var(--font-display);">¥248K</div><div style="font:400 10px/1 var(--font-sans); opacity:0.7; margin-top:4px;">今月売上</div></div>
    </div>
    <div style="backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:16px; padding:12px; border:1px solid rgba(255,255,255,0.2); background:var(--glass-nocturne); color:#faf2e8; height:160px; display:flex; flex-direction:column; justify-content:space-between;">
      <div><div style="font:500 12px/1 var(--font-sans); color:var(--rose-gold-soft);">glass-nocturne</div><div style="font:400 10px/1.2 var(--font-display); opacity:0.7;">rgba(61,46,42,.45)</div></div>
      <div><div style="font:300 32px/1 var(--font-display);">3.2<span style="font:400 11px/1 var(--font-sans); opacity:0.7; margin-left:4px;">×</span></div><div style="font:400 10px/1 var(--font-sans); opacity:0.7; margin-top:4px;">同伴率</div></div>
    </div>
  </div>
  <div style="font:400 12px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:12px;">
    実装は <code style="font:400 12px var(--font-mono); background:var(--pearl-deep); padding:2px 6px; border-radius:4px;">backdrop-filter: blur(16px)</code> 前提。3 トークンとも写真風グラデの上で読めることを確認済み。
  </div>
</div></body></html>
