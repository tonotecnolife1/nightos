<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div style="display:flex; align-items:center; gap:24px;">
    <div>
      <div class="t-metallic" style="font:500 36px/1 var(--font-serif); letter-spacing:0.04em;">NIGHTOS</div>
      <div style="font:400 12px/1.5 var(--font-display); letter-spacing:0.18em; color:var(--rose-gold-deep); margin-top:6px;">LUXURY · LADY · NIGHT</div>
    </div>
    <div style="flex:1; height:1px; background:linear-gradient(90deg, var(--gold-soft), transparent);"></div>
    <div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:32px; height:32px; border-radius:999px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold-deep); font:500 18px/1 var(--font-display);">N</div>
        <div style="font:500 16px/1 var(--font-serif);">NIGHTOS</div>
      </div>
      <div style="font:400 10px/1.4 var(--font-sans); color:var(--ink-mute); margin-top:6px;">small mark</div>
    </div>
  </div>
  <div style="margin-top:20px; padding:18px 20px; border-radius:22px; background:radial-gradient(ellipse at top, var(--nocturne-dusk) 0%, var(--nocturne-deep) 100%); color:#f8ede0;">
    <div class="t-metallic--light" style="font:600 30px/1 var(--font-serif); letter-spacing:0.04em; text-shadow:0 0 16px rgba(252,228,212,0.15);">NIGHTOS</div>
    <div style="font:400 11px/1.5 var(--font-display); letter-spacing:0.18em; color:#f8e0cc; margin-top:6px;">on nocturne — metallic-light</div>
  </div>
  <div style="font:400 11px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:12px;">
    ロゴはタイプセット(明朝×Cormorant)。塗りはせず、明朝＋メタリック clip-text で表現。アイコン版は gold 1px の輪郭のみ。
  </div>
</div></body></html>
