<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>オフライン | NIGHTOS</title>
    <style>
      /* globals.css に依存せず自己完結させる（SW から確実に配信するため）。
         V5 Bordeaux Salon のトークンをインラインで再現。 */
      :root {
        --pearl: #faf6f1;
        --ink: #2b232a;
        --ink-soft: #675d66;
        --ink-mute: #a39ba1;
        --wine-deep: #5e3838;
        --pearl-light: #f3eadb;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--pearl);
        color: var(--ink);
        font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 22rem; text-align: center; }
      h1 {
        font-family: "Cormorant Garamond", "Noto Serif JP", Georgia, serif;
        font-size: 24px;
        font-weight: 500;
        line-height: 1.3;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.7;
        margin: 0 0 1.25rem;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background: var(--wine-deep);
        color: var(--pearl-light);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        box-shadow: 0 4px 12px rgba(94, 56, 56, 0.18), 0 16px 32px rgba(94, 56, 56, 0.12);
        transition: transform 0.15s ease;
      }
      button:active { transform: translateY(1px); }
      .hint { margin-top: 1rem; font-size: 11px; color: var(--ink-mute); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>オフラインのようです</h1>
      <p>電波の届く場所で、もう一度お試しください。<br />接続が戻れば自動でつながります。</p>
      <button type="button" onclick="location.reload()">再読み込み</button>
      <p class="hint">通信が回復すると、この画面は自動的に切り替わります。</p>
    </div>
    <script>
      // オンラインに復帰したら自動でリロードして本来のページへ戻す
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
